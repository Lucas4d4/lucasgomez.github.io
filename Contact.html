<div class="divForm">
<form id="contact-form" action="https://formspree.io/f/mnjqnkok" method="post">
<table class="tableForm">
<tr>
<td>
<h1 class="h1Contact">CONTACT ME</h1>
</td>
</tr>

<tr>
<td>
<input type="text" name="name" minlength="2" maxlength="50" placeholder="Nombre y Apellido" class="textGeneral" required> 
</td>
</tr>

<tr>
<td>
<input type="email" name="email" placeholder="Email (@gmail.com, @outlook.com, etc)" class="textGeneral" required>
</td>
</tr>

<tr>
<td>
<input type="text" name="asunto" minlength="2" maxlength="50" placeholder="Asunto" class="textGeneral" required>
</td>
</tr>

<tr>
<td>
<textarea name="mensaje" minlength="10" rows="6" cols="30" placeholder="Redacte un mensaje..." class="textGeneral" style="resize:none" required></textarea>
</td>
</tr>

<tr>
<td>
<button type="submit" name="btnContact" class="btnEnviar">Enviar Mensaje</button>
<br>
<br>
<p id="form-status"></p>
